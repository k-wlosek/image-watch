# Example deployment.

services:
  image-watch:
    image: ghcr.io/example/image-watch:latest
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - image-watch-data:/var/lib/image-watch

    # Bind to localhost only.
    ports:
      - "127.0.0.1:9090:9090"

    environment:
      # IMAGE_WATCH_CHECK_INTERVAL: 6h
      # GHCR_USERNAME: ""
      # GHCR_PASSWORD: ""
      TZ: UTC

volumes:
  image-watch-data:
