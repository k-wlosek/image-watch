name: security

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-slim
    permissions:
      contents: read # same as global permissions
      security-events: write # required to write sarif report
      actions: read # required to upload sarif report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -format sarif ./... > govulncheck.sarif || true
          python3 - <<'PY'
          import json

          path = "govulncheck.sarif"
          with open(path) as report:
              sarif = json.load(report)

          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  stacks = result.get("stacks")
                  if stacks:
                      unique = []
                      seen = set()
                      for stack in stacks:
                          key = json.dumps(stack, sort_keys=True)
                          if key not in seen:
                              seen.add(key)
                              unique.append(stack)
                      result["stacks"] = unique

          with open(path, "w") as report:
              json.dump(sarif, report)
          PY
        continue-on-error: true
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: govulncheck.sarif

  coverage:
    runs-on: ubuntu-slim
    permissions:
      contents: read # same as global permissions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Compute coverage
        run: go test ./... -coverprofile=coverage.out
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false